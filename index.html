<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>.</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0a1424; }
    svg { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <svg id="pace"></svg>
  <script>
    const BG = "#0a1424";
    const ON_PACE = "#2a8cf0";
    const SLIPPING = "#f2d16b";
    const BEHIND = "#e8572e";
    const DIM = "#16263d";
    const LINE = "#dcebff";
    const FAINT = "rgba(150,200,255,0.18)";
    const BAND = "rgba(150,200,255,0.08)";
    const SLIPPING_ZONE = "rgba(242,209,107,0.09)";

    const SHOW_LABELS = false;

    const DAY = 86400000;

    function parseDate(s) {
      const [y, m, d] = s.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function addMonths(date, months) {
      const result = new Date(date.getTime());
      result.setMonth(result.getMonth() + months);
      return result;
    }

    function startOfDay(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    function mondayOf(date) {
      const result = startOfDay(date);
      const offset = (result.getDay() + 6) % 7;
      result.setDate(result.getDate() - offset);
      return result;
    }

    function el(name, attrs) {
      const node = document.createElementNS("http://www.w3.org/2000/svg", name);
      for (const key in attrs) node.setAttribute(key, attrs[key]);
      return node;
    }

    function label(svg, content, x, y, opts = {}) {
      if (!SHOW_LABELS) return;
      const node = el("text", {
        x,
        y,
        fill: opts.fill || "rgba(190,220,255,0.55)",
        "font-family": "ui-sans-serif, system-ui, -apple-system, sans-serif",
        "font-size": opts.size || 11,
        "font-weight": opts.weight || "400",
        "text-anchor": opts.anchor || "start",
        "dominant-baseline": opts.baseline || "auto",
        "pointer-events": "none",
      });
      node.textContent = content;
      svg.appendChild(node);
    }

    function formatMonthYear(date) {
      const month = date.toLocaleString("en-US", { month: "short" });
      return `${month} '${String(date.getFullYear()).slice(-2)}`;
    }

    function formatMonth(date) {
      return date.toLocaleString("en-US", { month: "short" });
    }

    function formatDay(date) {
      return date.toLocaleString("en-US", { month: "short", day: "numeric" });
    }

    function draw() {
      const data = window.PACE;
      const svg = document.getElementById("pace");
      while (svg.firstChild) svg.removeChild(svg.firstChild);

      const width = svg.clientWidth;
      const height = svg.clientHeight;
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

      const pad = Math.max(16, Math.min(width, height) * 0.04);
      const gap = pad * 1.5;
      const topHeight = (height - pad * 2 - gap) * 0.65;
      const bottomTop = pad + topHeight + gap;
      const bottomHeight = height - pad - bottomTop;

      drawUnits(svg, data, pad, pad, width - pad * 2, topHeight);
      drawWeek(svg, data, pad, bottomTop, width - pad * 2, bottomHeight);
    }

    function drawUnits(svg, data, x, y, w, h) {
      const start = parseDate(data.start);
      const end = addMonths(start, data.targetMonths);
      const totalDays = (end - start) / DAY;
      const today = startOfDay(new Date());
      const total = data.totalUnits;
      const unitsPerDay = total / totalDays;
      const amberUnits = unitsPerDay * 14;
      const fontSize = Math.max(10, Math.min(13, Math.min(w, h) * 0.028));
      const leftGutter = SHOW_LABELS ? fontSize * 5.6 : 0;
      const bottomGutter = SHOW_LABELS ? fontSize * 2.4 : 0;
      const plotX = x + leftGutter;
      const plotY = y;
      const plotW = w - leftGutter;
      const plotH = h - bottomGutter;

      const xAt = (date) => plotX + Math.max(0, Math.min(1, (date - start) / DAY / totalDays)) * plotW;
      const yAt = (units) => plotY + plotH - Math.max(0, Math.min(total, units)) / total * plotH;

      // Amber zone: the band between the target line and 14 days behind it.
      const zone = el("polygon", {
        points: [
          [xAt(start), yAt(0)],
          [xAt(end), yAt(total)],
          [xAt(end), yAt(Math.max(0, total - amberUnits))],
          [xAt(new Date(start.getTime() + 14 * DAY)), yAt(0)],
        ].map((p) => p.join(",")).join(" "),
        fill: SLIPPING_ZONE,
      });
      svg.appendChild(zone);

      // Finish line.
      svg.appendChild(el("line", {
        x1: plotX, y1: yAt(total), x2: plotX + plotW, y2: yAt(total),
        stroke: FAINT, "stroke-width": 1,
      }));

      // Target line.
      svg.appendChild(el("line", {
        x1: xAt(start), y1: yAt(0), x2: xAt(end), y2: yAt(total),
        stroke: "rgba(150,200,255,0.5)", "stroke-width": 1.5,
      }));

      // Actual completions as a step line.
      const completions = data.completed
        .map((entry) => ({ date: parseDate(entry.date), units: entry.units }))
        .filter((entry) => entry.date <= today)
        .sort((a, b) => a.date - b.date);

      let cumulative = 0;
      const steps = [[start, 0]];
      for (const entry of completions) {
        steps.push([entry.date, cumulative]);
        cumulative += entry.units;
        steps.push([entry.date, cumulative]);
      }
      const lastDate = today < end ? today : end;
      steps.push([lastDate, cumulative]);

      const stepPoints = steps
        .map(([date, units]) => `${xAt(date)},${yAt(units)}`)
        .join(" ");
      svg.appendChild(el("polyline", {
        points: stepPoints,
        fill: "none",
        stroke: LINE,
        "stroke-width": 2.5,
        "stroke-linejoin": "round",
      }));

      // Current batch: dashed step from today up to the goal date.
      if (data.current && today >= start && today <= end) {
        const goal = parseDate(data.current.goal);
        const overdue = goal < today;
        const goalDate = overdue ? today : goal;
        const goalUnits = cumulative + data.current.units;
        const expectedAtGoal = unitsPerDay * (goalDate - start) / DAY;
        const shortfall = expectedAtGoal - goalUnits;
        const goalColor = overdue ? BEHIND
          : shortfall <= 0 ? ON_PACE
          : shortfall <= amberUnits ? SLIPPING
          : BEHIND;

        svg.appendChild(el("polyline", {
          points: [
            [xAt(today), yAt(cumulative)],
            [xAt(goalDate), yAt(cumulative)],
            [xAt(goalDate), yAt(goalUnits)],
          ].map((p) => p.join(",")).join(" "),
          fill: "none",
          stroke: goalColor,
          "stroke-width": 1.5,
          "stroke-dasharray": "4 4",
        }));
        svg.appendChild(el("circle", {
          cx: xAt(goalDate), cy: yAt(goalUnits), r: 5,
          fill: BG, stroke: goalColor, "stroke-width": 2,
        }));
        label(svg, `${goalUnits} ${overdue ? "was due" : "by"} ${formatDay(goal)}`,
          xAt(goalDate) + 10, yAt(goalUnits) + 4, {
            size: fontSize,
            fill: goalColor,
          });
      }

      // Today marker and status dot.
      if (today >= start && today <= end) {
        svg.appendChild(el("line", {
          x1: xAt(today), y1: plotY, x2: xAt(today), y2: plotY + plotH,
          stroke: FAINT, "stroke-width": 1,
        }));

        const elapsed = (today - start) / DAY;
        const expected = unitsPerDay * elapsed;
        const behind = expected - cumulative;
        const color = behind <= 0 ? ON_PACE : behind <= amberUnits ? SLIPPING : BEHIND;

        svg.appendChild(el("circle", {
          cx: xAt(today), cy: yAt(cumulative), r: 5,
          fill: color,
        }));

        const todayX = xAt(today);
        label(svg, "today", todayX + 8, plotY + fontSize, {
          size: fontSize,
        });
        label(svg, String(cumulative), todayX - 10, yAt(cumulative) + 4, {
          size: fontSize,
          fill: color,
          weight: "500",
          anchor: "end",
        });
      }

      label(svg, `${total} units`, plotX - 10, yAt(total), {
        size: fontSize,
        anchor: "end",
        baseline: "middle",
      });
      label(svg, "target", plotX + plotW, yAt(total) - 6, {
        size: fontSize,
        anchor: "end",
      });

      const axisY = plotY + plotH + fontSize * 1.5;
      label(svg, formatMonthYear(start), plotX, axisY, {
        size: fontSize,
        anchor: "start",
      });
      label(svg, formatMonthYear(end), plotX + plotW, axisY, {
        size: fontSize,
        anchor: "end",
      });

      const minTickGap = Math.max(72, fontSize * 7);
      let tick = new Date(start.getFullYear(), start.getMonth() + 3, 1);
      while (SHOW_LABELS && tick < end) {
        const tickX = xAt(tick);
        if (tickX - plotX > minTickGap && plotX + plotW - tickX > minTickGap) {
          svg.appendChild(el("line", {
            x1: tickX, y1: plotY + plotH, x2: tickX, y2: plotY + plotH + 4,
            stroke: FAINT, "stroke-width": 1,
          }));
          label(svg, formatMonth(tick), tickX, axisY, {
            size: fontSize,
            anchor: "middle",
          });
        }
        tick = addMonths(tick, 3);
      }
    }

    function drawWeek(svg, data, x, y, w, h) {
      const today = startOfDay(new Date());
      const thisMonday = mondayOf(today);
      const weekMonday = parseDate(data.week.of);
      const fresh = weekMonday.getTime() === thisMonday.getTime();
      const hours = fresh ? data.week.hours : [0, 0, 0, 0, 0, 0, 0];
      const dayIndex = (today.getDay() + 6) % 7;

      const [weekMin, weekMax] = data.weeklyHours;
      const [dayMin] = data.dailyHours;
      const total = hours.reduce((sum, value) => sum + value, 0);
      const scaleMax = Math.max(weekMax * 1.3, total);
      const daysElapsed = fresh ? dayIndex + 1 : 0;
      const tick = fresh ? weekMin * daysElapsed / 7 : 0;

      const fontSize = Math.max(10, Math.min(12, Math.min(w, h) * 0.05));
      const labelSpace = SHOW_LABELS ? fontSize * 1.7 : 0;
      const trackHeight = Math.min(22, h * 0.18);
      const trackY = y + labelSpace;
      const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

      label(svg, `${total}h this week`, x, y + fontSize, {
        size: fontSize,
        fill: LINE,
        weight: "500",
      });
      label(svg, `${weekMin}–${weekMax}h target`, x + w, y + fontSize, {
        size: fontSize,
        anchor: "end",
      });

      // Weekly track.
      svg.appendChild(el("rect", {
        x, y: trackY, width: w, height: trackHeight, rx: trackHeight / 2,
        fill: DIM,
      }));

      // Target band on the track.
      const bandX = x + (weekMin / scaleMax) * w;
      const bandW = ((weekMax - weekMin) / scaleMax) * w;
      svg.appendChild(el("rect", {
        x: bandX, y: trackY, width: bandW, height: trackHeight,
        fill: BAND,
      }));

      // Filled bar.
      const barColor = total >= tick ? ON_PACE : total >= tick * 0.75 ? SLIPPING : BEHIND;
      const barW = Math.max(0, Math.min(1, total / scaleMax)) * w;
      if (barW > 0) {
        svg.appendChild(el("rect", {
          x, y: trackY, width: Math.max(barW, trackHeight), height: trackHeight,
          rx: trackHeight / 2,
          fill: barColor,
        }));
      }

      // Pro-rated tick.
      if (fresh) {
        const tickX = x + (tick / scaleMax) * w;
        svg.appendChild(el("line", {
          x1: tickX, y1: trackY - 4, x2: tickX, y2: trackY + trackHeight + 4,
          stroke: LINE, "stroke-width": 2,
        }));
      }

      // Daily pips.
      const pipLabelH = SHOW_LABELS ? fontSize * 1.6 : 0;
      const pipTop = trackY + trackHeight + Math.max(12, h * 0.1);
      const pipHeight = y + h - pipTop - pipLabelH;
      const pipGap = Math.max(6, w * 0.012);
      const pipWidth = (w - pipGap * 6) / 7;
      const pipScale = data.dailyHours[1] * 1.6;

      const weekOnPace = total >= tick;

      for (let i = 0; i < 7; i++) {
        const px = x + i * (pipWidth + pipGap);
        const future = !fresh || i > dayIndex;
        const value = hours[i] || 0;

        svg.appendChild(el("rect", {
          x: px, y: pipTop, width: pipWidth, height: pipHeight, rx: 3,
          fill: DIM, opacity: future ? 0.45 : 1,
        }));

        // Faint daily target band.
        const bandTop = pipTop + pipHeight * (1 - data.dailyHours[1] / pipScale);
        const bandBottom = pipTop + pipHeight * (1 - dayMin / pipScale);
        svg.appendChild(el("rect", {
          x: px, y: bandTop, width: pipWidth,
          height: Math.max(0, bandBottom - bandTop),
          fill: BAND, opacity: future ? 0.4 : 1,
        }));

        if (!future && value > 0) {
          let color = ON_PACE;
          if (value < dayMin) color = value >= dayMin * 0.5 ? SLIPPING : BEHIND;
          if (color === BEHIND && i >= 5 && weekOnPace) color = SLIPPING;

          const fillHeight = Math.min(pipHeight, value / pipScale * pipHeight);
          svg.appendChild(el("rect", {
            x: px, y: pipTop + pipHeight - fillHeight,
            width: pipWidth, height: fillHeight, rx: 3,
            fill: color,
          }));

          label(svg, `${value}h`, px + pipWidth / 2, pipTop + fontSize, {
            size: fontSize,
            anchor: "middle",
            fill: color,
          });
        }

        label(svg, days[i], px + pipWidth / 2, y + h, {
          size: fontSize,
          anchor: "middle",
          fill: future ? "rgba(190,220,255,0.3)" : "rgba(190,220,255,0.6)",
        });
      }
    }

    // A query string works on a web server (and skips a cached copy) but
    // makes the file unreadable when the page is opened straight from disk.
    const dataScript = document.createElement("script");
    dataScript.src = location.protocol === "file:"
      ? "pace-data.js"
      : "pace-data.js?v=" + Date.now();
    dataScript.onload = () => {
      draw();
      window.addEventListener("resize", draw);
    };
    document.body.appendChild(dataScript);
  </script>
</body>
</html>
